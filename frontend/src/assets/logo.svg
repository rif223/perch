<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Perch: a mini player perched on the corner of a screen -->
  <defs>
    <linearGradient id="perch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6BEBB0"/>
      <stop offset="1" stop-color="#0F8A57"/>
    </linearGradient>
    <filter id="perch-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#03301D" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#perch-bg)"/>
  <rect x="176" y="208" width="620" height="440" rx="64" fill="#FFFFFF" fill-opacity="0.22"/>
  <g filter="url(#perch-shadow)">
    <rect x="436" y="492" width="404" height="264" rx="52" fill="#1B201E" stroke="#FFFFFF" stroke-width="30"/>
    <path d="M608 574 L608 674 L694 624 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="30" stroke-linejoin="round"/>
  </g>
</svg>
